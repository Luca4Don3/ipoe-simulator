name: Windows packages

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      approve_formal_release:
        description: "已完成目标 Windows 设备实测与敏感信息审计"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run offline tests
        run: |
          python -m unittest discover -v
          python -m compileall -q .
          git diff --check

  powershell-51-compatibility:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Parse launcher with Windows PowerShell 5.1
        shell: powershell
        run: |
          $launcher = Join-Path $PWD 'scripts/windows_launcher.ps1'
          $null = [scriptblock]::Create([IO.File]::ReadAllText($launcher))
          if (-not (Test-Path -LiteralPath (Join-Path $PWD 'run.cmd'))) {
            throw 'run.cmd 不存在'
          }
          Write-Output 'Windows PowerShell 5.1 launcher syntax OK'
      - name: Probe Windows PowerShell 5.1 network command types
        shell: powershell
        run: |
          $required = @(
            'Get-NetAdapter',
            'Get-NetIPInterface',
            'Get-NetIPAddress',
            'Get-NetRoute',
            'Get-DnsClientServerAddress',
            'New-NetIPAddress',
            'Set-NetIPInterface',
            'Set-DnsClientServerAddress'
          )
          foreach ($name in $required) {
            $command = Get-Command -Name $name -CommandType Cmdlet,Function -ErrorAction Stop
            if ($command.CommandType -notin @('Cmdlet', 'Function')) {
              throw "$name 命令类型不受支持: $($command.CommandType)"
            }
            Write-Output "$name`: $($command.CommandType)"
          }

  metadata:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: version
        name: Detect VERSION change
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]] &&
             git diff --quiet HEAD^ HEAD -- VERSION; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs:
      - test
      - powershell-51-compatibility
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - x86
          - x64
          - arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build and verify portable package
        shell: pwsh
        run: |
          ./scripts/build_windows_release.ps1 `
            -Architecture "${{ matrix.architecture }}"
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.architecture }}
          path: .temp/release/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.approve_formal_release == true
    needs:
      - build
      - metadata
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-*
          path: .temp/release
          merge-multiple: true
      - name: Verify attachment set and checksums
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          for architecture in x86 x64 arm64; do
            archive=".temp/release/ipoe-simulator-v${version}-windows-${architecture}.zip"
            test -f "$archive"
            python scripts/verify_windows_release.py \
              "$archive" \
              --architecture "$architecture" \
              --version "$version"
          done
          (
            cd .temp/release
            sha256sum *.zip > SHA256SUMS.txt
          )
          test "$(wc -l < .temp/release/SHA256SUMS.txt)" -eq 3
      - name: Create one tag and formal GitHub Release
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release ${tag} 已存在；拒绝重复发布。" >&2
            exit 1
          fi
          gh release create "$tag" \
            .temp/release/ipoe-simulator-v${version}-windows-x86.zip \
            .temp/release/ipoe-simulator-v${version}-windows-x64.zip \
            .temp/release/ipoe-simulator-v${version}-windows-arm64.zip \
            .temp/release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "IPoE Simulator ${tag}" \
            --notes-file RELEASE_NOTES.md
